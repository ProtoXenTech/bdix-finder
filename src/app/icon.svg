  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#glow)" stroke-width="24" stroke-dasharray="750" stroke-dashoffset="150" stroke-linecap="round" filter="url(#shadow)"/>
  
  <path d="M272 112L160 272H256L240 400L352 240H256L272 112Z" fill="url(#glow)" filter="url(#shadow)"/>
